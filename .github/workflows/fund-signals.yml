# Fund signals + credit signals + UCC signals: reads SEC data with edgartools and sends it to HQ (Pipeline → Fund signals / Credit signals).
# Free (public repo). Needs two repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   FUND_INGEST_KEY  copy it from HQ → Pipeline → Fund signals → Settings
#   SEC_IDENTITY     your name and email, e.g. "OuterHaven Advisory ops@yourdomain.com" (the SEC asks every tool to identify itself)
name: Fund signals

on:
  schedule:
    - cron: "40 1 * * *"   # daily 09:40 MYT: new Fund II/III filings, the Fund I window turning 3.5 years, checks
    - cron: "10 * * * *"   # hourly: Fund II checks queued from HQ
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | live | fund1 | check | recheck | credit | officers | bdc | bdcdry | bdcprobe | ucc | uccprobe | probe | study1 | study2 | selftest | audit | adviser | adviserprobe | officersprobe (from = CIKs, comma-separated)"
        default: daily
        required: true
      from:
        description: "Start date YYYY-MM-DD (live / fund1 backfills); probe: names separated by ;  uccprobe/ucc: registries e.g. FL,OR  bdcprobe: zip name e.g. 2026_08_bdc.zip"
        required: false
      to:
        description: "End date YYYY-MM-DD"
        required: false

# No concurrency group: GitHub keeps only ONE pending run per group and cancels the rest, which silently dropped
# queued backfills (2 Oct 2026). Runs may now overlap, so each is capped at 4 SEC requests/s (SEC allows 10/s in total).

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements-fund-signals.txt
      - run: pip install -r scripts/requirements-fund-signals.txt
      # SBA PPP loan file (450 MB, final release Sept 2024) used to size private companies in UCC signals. Downloaded once.
      - uses: actions/cache@v4
        if: github.event.schedule != '10 * * * *'
        with:
          path: data/ppp
          key: ppp-public-150k-plus-240930
      - name: Run
        env:
          FUND_INGEST_KEY: ${{ secrets.FUND_INGEST_KEY }}
          EDGAR_RATE_LIMIT_PER_SEC: "4"
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "10 * * * *" ]; then MODE=check; else MODE=daily; fi
          else
            MODE="$IN_MODE"
          fi
          case "$MODE" in daily|live|fund1|check|recheck|credit|officers|bdc|bdcdry|bdcprobe|ucc|uccprobe|probe|study1|study2|selftest|audit|adviser|adviserprobe|officersprobe) ;; *) echo "unknown mode $MODE"; exit 1;; esac
          if [ "$MODE" = "credit" ]; then python scripts/credit_signals.py; exit $?; fi
          if [ "$MODE" = "officers" ]; then python scripts/officers.py; exit $?; fi
          if [ "$MODE" = "officersprobe" ]; then python scripts/officers.py --probe "$IN_FROM"; exit $?; fi
          if [ "$MODE" = "bdc" ]; then python scripts/bdc_signals.py; exit $?; fi
          if [ "$MODE" = "bdcdry" ]; then python scripts/bdc_signals.py --dry; exit $?; fi
          if [ "$MODE" = "bdcprobe" ]; then python scripts/bdc_signals.py --probe "${IN_FROM:-2026_08_bdc.zip}"; exit $?; fi
          if [ "$MODE" = "ucc" ]; then python scripts/ucc_signals.py --only "$IN_FROM"; exit $?; fi
          if [ "$MODE" = "uccprobe" ]; then python scripts/ucc_signals.py --dry --only "$IN_FROM"; exit $?; fi
          if [ "$MODE" = "adviserprobe" ]; then python scripts/adviser_aum.py --mode probe --q "${IN_FROM:-Solomon Hess}"; exit $?; fi
          if [ "$MODE" = "adviser" ]; then python scripts/adviser_aum.py --mode run --full; exit $?; fi
          set -- --mode "$MODE"
          if [ "$MODE" = "probe" ]; then python scripts/fund_signals.py --mode probe --from "$IN_FROM"; exit $?; fi
          if [[ "$IN_FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then set -- "$@" --from "$IN_FROM"; fi
          if [[ "$IN_TO" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then set -- "$@" --to "$IN_TO"; fi
          rc=0
          python scripts/fund_signals.py "$@" || rc=$?
          # The daily run also refreshes credit signals (public companies that need private credit), even when a fund
          # self-test failed; the run still ends red so the failure is seen.
          if [ "$MODE" = "daily" ]; then python scripts/credit_signals.py || rc=$?; fi
          # ...then the CFO / CEO names on each credit target's latest SEC certifications (for the contact line in HQ).
          if [ "$MODE" = "daily" ]; then python scripts/officers.py || rc=$?; fi
          # ...and sizes every fund lead's manager from the SEC adviser files (Form ADV; refreshed monthly by the SEC).
          if [ "$MODE" = "daily" ]; then python scripts/adviser_aum.py --mode run || rc=$?; fi
          # ...and private companies from state UCC lien filings (CT, CO, OR open data + Florida federal tax liens) sized by PPP loans.
          if [ "$MODE" = "daily" ]; then python scripts/ucc_signals.py || rc=$?; fi
          # ...and, on Mondays, private companies from every BDC's loan list (the SEC publishes the BDC data sets monthly).
          if [ "$MODE" = "daily" ] && [ "$(date -u +%u)" = "1" ]; then python scripts/bdc_signals.py || rc=$?; fi
          exit $rc
